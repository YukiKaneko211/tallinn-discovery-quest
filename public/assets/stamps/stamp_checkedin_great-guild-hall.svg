<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Great Guild Hall stamp">
  <defs>
    <path id="arcTop" d="M 48 150 A 102 102 0 0 1 252 150"/>
    <path id="arcBot" d="M 22 150 A 128 128 0 0 0 278 150"/>
    <clipPath id="inner"><circle cx="150" cy="150" r="86"/></clipPath>
    <linearGradient id="isky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6ff"/><stop offset="100%" stop-color="#f5f7ff"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="146" fill="#ffffff"/>
  <circle cx="150" cy="150" r="142" fill="none" stroke="#0072ce" stroke-width="8"/>
  <circle cx="150" cy="150" r="90" fill="none" stroke="#0072ce" stroke-width="6"/>
  <g clip-path="url(#inner)">
    <rect x="60" y="60" width="180" height="180" fill="url(#isky)"/>
    <g transform="translate(150 240) scale(0.44) translate(-200 -350)">
    <path d="M90 350 V150 L200 70 L310 150 V350 Z" fill="#f0e6d6"/>
    <path d="M80 152 L200 62 L320 152 Z" fill="#3a4a7a"/>
    <g fill="#fff" opacity=".7">
      <rect x="120" y="200" width="30" height="44" rx="6"/>
      <rect x="185" y="200" width="30" height="44" rx="6"/>
      <rect x="250" y="200" width="30" height="44" rx="6"/>
    </g>
    <rect x="170" y="280" width="60" height="70" rx="6" fill="#5a3f28"/></g>
    <rect x="60" y="212" width="180" height="30" fill="#7a8b6f"/>
  </g>
  <g fill="#0072ce" font-family="'M PLUS Rounded 1c', 'Trebuchet MS', sans-serif" font-weight="800" font-size="28" letter-spacing="2">
    <text text-anchor="middle"><textPath href="#arcTop" startOffset="50%">GREAT GUILD</textPath></text>
    <text text-anchor="middle"><textPath href="#arcBot" startOffset="50%">HALL</textPath></text>
  </g>
  <circle cx="42" cy="150" r="5" fill="#0072ce"/><circle cx="258" cy="150" r="5" fill="#0072ce"/>
