    </g>
    <circle cx="200" cy="250" r="26" fill="#ffd166" opacity=".55"/></g>
    <rect x="60" y="212" width="180" height="30" fill="#7a8b6f"/>
  </g>
  <g fill="#0072ce" font-family="'M PLUS Rounded 1c', 'Trebuchet MS', sans-serif" font-weight="800" font-size="21" letter-spacing="2">
    <text text-anchor="middle"><textPath href="#arcTop" startOffset="50%">ST. CATHERINE'S</textPath></text>
    <text text-anchor="middle"><textPath href="#arcBot" startOffset="50%">PASSAGE</textPath></text>
  </g>
  <circle cx="42" cy="150" r="5" fill="#0072ce"/><circle cx="258" cy="150" r="5" fill="#0072ce"/>
